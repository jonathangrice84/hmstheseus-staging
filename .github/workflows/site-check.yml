name: Site Checks

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Start local server
        run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/hmstheseus-staging.log 2>&1 &

      - name: Run site checks
        run: node scripts/check-site.mjs http://127.0.0.1:4173/

      - name: Install Playwright browsers
        run: npx --yes playwright install --with-deps chromium

      - name: Run browser smoke test
        run: npx --yes -p playwright node scripts/browser-smoke.cjs http://127.0.0.1:4173/ browser-artifacts

      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-artifacts
          path: browser-artifacts
